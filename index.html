<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MediaPipe Camera Utils 測試</title>
    <!-- 載入 MediaPipe Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- 建立一個用來顯示攝影機畫面的 video 標籤 -->
    <video id="input_video" width="640" height="480" autoplay playsinline></video>

    <script>
        // 取得頁面上的 video 元素
        const videoElement = document.getElementById('input_video');

        // 初始化 MediaPipe 的 Camera 實例
        const camera = new Camera(videoElement, {
            // onFrame 會在攝影機每次有新畫面時被呼叫 (通常是每秒 30 或 60 次)
            onFrame: async () => {
                // 在這裡處理影像
                // 實務上通常會將 videoElement 傳遞給 MediaPipe 的 AI 模型
                // 例如：await myFaceMeshModel.send({image: videoElement});
                console.log("擷取到新的影像幀！");
            },
            width: 640,
            height: 480
        });

        // 啟動攝影機
        camera.start()
            .then(() => console.log("攝影機已成功啟動！"))
            .catch(error => console.error("啟動攝影機失敗:", error));
    </script>
</body>
</html>
